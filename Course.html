<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ course[1] }}</title>

</head>

<body>

    <h1>{{ course[1] }}</h1>

    <p>{{ course[2] }}</p>

    <p>
        Duration: {{ course[3] }}
    </p>

    <br>

    <a href="/enroll/{{ course[0] }}">
        Enroll Now
    </a>

    <br><br>

    <h2>Lessons</h2>

    {% for lesson in lessons %}

        <p>
            {{ lesson[2] }}
        </p>

    {% endfor %}

    <br>

    <a href="/lessons/{{ course[0] }}">
        Start Learning
    </a>

    <br><br>

    <a href="/courses">
        Back to Courses
    </a>

</body>

</html>
